<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow" />
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="assets/192x192.png">

    <title>Films familiaux</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍿</text></svg>">
    
    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="easter-eggs.css">
</head>
<body>
    <div class="vhs-overlay" aria-hidden="true"></div> 
    <canvas id="matrix-canvas" aria-hidden="true"></canvas>

    <div id="main-content">
        <header role="banner">
            <div class="header-content">
                <h1>
                    <span id="popcorn-logo" title="🍿">🍿</span> 
                    <span class="title-gradient title-text" onclick="window.appUi?.resetAll()">Films familiaux</span>
                </h1>

                <div class="header-right">
                    <button id="mobile-search-trigger" class="mobile-search-trigger" aria-label="Ouvrir la recherche">
                        <i data-lucide="search" size="18" aria-hidden="true"></i>
                    </button>
                    
                    <div class="search-wrapper" id="search-wrapper">
                        <i data-lucide="search" class="search-icon hide-mobile" aria-hidden="true"></i>
                        <input 
                            type="text" 
                            id="query" 
                            class="search-box" 
                            placeholder="Ajouter un film..."
                            autocomplete="off"
                            autocorrect="off"
                            spellcheck="false"
                            role="combobox"
                            aria-expanded="false"
                            aria-autocomplete="list"
                            aria-controls="search-results"
                            aria-label="Rechercher un film"
                        >
                        <button id="mobile-search-close" class="mobile-search-close" aria-label="Fermer la recherche">
                            <i data-lucide="chevron-right" size="20" aria-hidden="true"></i>
                        </button>
                        <button id="clear-btn" class="clear-btn" aria-label="Effacer la recherche">
                            <i data-lucide="x" size="16" aria-hidden="true"></i>
                        </button>
                        <div id="search-results" role="listbox" aria-label="Résultats de recherche"></div>
                    </div>
                </div>
            </div>
        </header>

        <main class="container">
            <!-- Controls Bar -->
            <div class="section-header" id="controls-bar" role="toolbar" aria-label="Filtres et tri">
                <div class="header-left">
                    <i data-lucide="list-video" style="color: var(--accent);" aria-hidden="true"></i>
                    <span style="font-weight: 700; font-size: 1.1rem;">Ma Liste</span>
                    <span id="count-badge" class="count-badge" aria-live="polite" aria-label="Nombre de films">0</span>
                    <div id="active-filter" class="active-filter-chip hidden" role="button" tabindex="0" aria-label="Filtre actif, cliquer pour supprimer">
                        <span id="active-filter-text"></span>
                        <i data-lucide="x" size="14" aria-hidden="true"></i>
                    </div>
                </div>
                
                <div class="header-controls">
                    <button id="btn-toggle-titles" class="sort-btn icon-only" title="Toujours afficher les titres" aria-label="Toujours afficher les titres">
                        <i data-lucide="type" size="16" aria-hidden="true"></i>
                    </button>
                    <button id="btn-sort-behavior" class="sort-btn icon-only active" title="Regrouper les films vus en bas" aria-label="Regrouper les films vus en bas">
                        <i data-lucide="eye-off" size="16" aria-hidden="true"></i>
                    </button>
                    
                    <div class="sort-wrapper">
                        <div class="sort-btn" aria-hidden="true">
                            <i data-lucide="arrow-up-down" size="16" aria-hidden="true"></i>
                            <span class="hide-mobile" id="sort-label-text">Ajoutés Récemment</span>
                        </div>
                        <label for="sort-select" class="hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Trier par</label>
                        <select id="sort-select" class="hidden-select" aria-label="Trier par">
                            <option value="default">Ajoutés Récemment</option>
                            <option value="genre">Par Genre</option>
                            <option value="alpha">Titre (A-Z)</option>
                            <option value="recent">Date de sortie (Récents)</option>
                            <option value="old">Date de sortie (Anciens)</option>
                            <option value="rating">Meilleures Notes</option>
                            <option value="short">Durée (Court)</option>
                            <option value="long">Durée (Long)</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <div id="movie-grid" class="movie-grid" role="list" aria-label="Films de la liste"></div>
        </main>
    </div>

    <!-- ADVANCED RANDOMIZER PANEL -->
    <div id="randomizer-panel" class="randomizer-panel" role="dialog" aria-modal="true" aria-label="Choisir un film au hasard">
        <div class="rand-header">
            <h3>Que regardons-nous ?</h3>
            <button id="close-rand-btn" class="circle-btn" style="width:28px; height:28px;" aria-label="Fermer">
                <i data-lucide="x" size="14" aria-hidden="true"></i>
            </button>
        </div>

        <div class="rand-section" id="rand-duration-section">
            <div class="rand-label" id="rand-duration-label">Durée</div>
            <div class="chip-group" id="rand-duration-group" role="radiogroup" aria-labelledby="rand-duration-label">
                <button class="chip active" data-val="any" role="radio" aria-checked="true">Peu importe</button>
                <button class="chip" data-val="short" role="radio" aria-checked="false">&lt; 1h30</button>
                <button class="chip" data-val="medium" role="radio" aria-checked="false">Classique (1h30-2h15)</button>
                <button class="chip" data-val="long" role="radio" aria-checked="false">&gt; 2h15</button>
            </div>
        </div>

        <div class="rand-section">
            <div class="rand-label" id="rand-rating-label">Ambiance (Note)</div>
            <div class="chip-group" id="rand-rating-group" role="radiogroup" aria-labelledby="rand-rating-label">
                <button class="chip active" data-val="any" role="radio" aria-checked="true">Peu importe</button>
                <button class="chip" data-val="good" role="radio" aria-checked="false">Valeur sûre (8+)</button>
                <button class="chip" data-val="bad" role="radio" aria-checked="false">Plaisir coupable (&lt; 6)</button>
            </div>
        </div>

        <div class="rand-section">
            <div class="rand-label">Genre</div>
            <div class="chip-group scrollable" id="rand-genre-group" role="radiogroup" aria-label="Filtrer par genre">
                <!-- Dynamically populated by JS -->
            </div>
        </div>

        <button id="btn-roll-dice" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
            <i data-lucide="dices" aria-hidden="true"></i> Lancer les dés
        </button>
    </div>

    <!-- FAB RANDOM -->
    <button id="fab-random" class="fab-random" aria-label="Choisir au hasard">
        <i data-lucide="dices" aria-hidden="true"></i>
    </button>

    <!-- TOAST -->
    <div id="toast" role="status" aria-live="polite">
        <i data-lucide="check-circle" size="20" color="var(--green)" aria-hidden="true"></i> 
        <span id="toast-msg">Notification</span>
    </div>

    <!-- MODAL -->
    <div id="modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="m-title">
        <div id="modal-ambient-bg" class="modal-ambient-bg" aria-hidden="true"></div>
        
        <div class="modal-content" id="modal-content-box">
            <div class="modal-actions-top">
                <button id="btn-modal-close" class="circle-btn" aria-label="Fermer">
                    <i data-lucide="x" aria-hidden="true"></i>
                </button>
            </div>

            <div id="modal-scroll-wrapper" class="modal-scroll-wrapper">
                <div class="modal-hero" aria-hidden="true">
                    <img id="m-backdrop" class="modal-backdrop" src="" alt="">
                </div>
                
                <div class="modal-body">
                    <div id="sticky-sentinel" class="sticky-sentinel"></div>
                    
                    <div id="sticky-header" class="sticky-header">
                        <div class="header-text-group">
                            <h2 id="m-title" class="modal-title">Titre</h2>
                            <div class="sticky-meta">
                                <div class="rating-container" id="m-rating-stars"></div>
                                <span class="meta-divider" aria-hidden="true"></span>
                                <span id="m-date"></span>
                                <span class="meta-divider" aria-hidden="true"></span>
                                <span id="m-runtime"></span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="modal-details">
                        <div id="m-genre" class="genre-text"></div>
                        <div id="m-director" class="director-text"></div> 

                        <p id="m-synopsis" class="modal-desc">Résumé...</p>
                        
                        <!-- Library Mode Actions -->
                        <div id="library-actions" class="action-row">
                            <button id="btn-watch" class="btn btn-primary">
                                <i data-lucide="eye" size="18" aria-hidden="true"></i>
                                <span>Marquer Vu</span>
                            </button>
                            <a id="btn-allocine" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-allocine" aria-label="Voir sur Allociné">Allociné</a>
                        </div>
                        
                        <!-- Preview Mode Actions (when clicking search result) -->
                        <div id="preview-actions" class="action-row hidden">
                            <button id="btn-add-preview" class="btn btn-primary">
                                <i data-lucide="plus" size="18" aria-hidden="true"></i>
                                <span>Ajouter à la liste</span>
                            </button>
                            <a id="btn-allocine-preview" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-allocine" aria-label="Voir sur Allociné">Allociné</a>
                        </div>

                        <button id="btn-delete" class="btn btn-danger">Retirer de la liste</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="app.js"></script>
    <script src="easter-eggs.js"></script>
</body>
</html>
